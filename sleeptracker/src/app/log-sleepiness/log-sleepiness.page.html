<ion-header>
  <ion-toolbar>
    <ion-title>Log Sleepiness</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class ="ion-padding">
  <h3>How tired do you feel right now?</h3>

  <ion-list>
    @for (value of values; track value) {
      <ion-item (click) ="select(value)">
        <ion-label class ="ion-text-wrap">
          <h2>{{value}}</h2>
          <p>{{scaleValues[value]}}</p>
        </ion-label>
        @if (value == selectedValue) {
      <ion-icon slot ="end" name="checkmark-circle" color="primary"></ion-icon>
    }
      </ion-item>
    }
  </ion-list>


  <ion-button expand="block" shape ="round" [disabled]="selectedValue == 0" (click)="save()">Save</ion-button>
  <ion-button expand="block" fill="clear" (click)="cancel()">Cancel</ion-button>
</ion-content>
