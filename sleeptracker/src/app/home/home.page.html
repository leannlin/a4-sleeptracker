<ion-header>
  <ion-toolbar>
    <ion-title>Sleep Tracker</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class ="ion-padding">
  <ion-button expand="block" shape="round" (click)="presentLogSleep()">
    <ion-icon slot ="start" name="moon"></ion-icon>
    Log sleep
  </ion-button>
  <ion-button expand="block" shape="round" (click)="presentLogSleepiness()">
    <ion-icon slot="start" name="cafe"></ion-icon>
    Log sleepiness
</ion-button>

  <ion-list>
    @for (data of allSleepData; track data.id) {
      <ion-card>
        <ion-card-header>
        <ion-card-subtitle>{{data.dateString()}}</ion-card-subtitle>
          <ion-card-title>{{data.summaryString()}}</ion-card-title>
        </ion-card-header>
      </ion-card>
    }

  </ion-list>
</ion-content>
